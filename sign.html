        <h4>Password *</h4>

          type="password"
          id="userpassword"
          placeholder="Enter your password"
          required
        />

        <button type="submit">Sign-Up</button>
        <h5>Already have a account?</h5>
        <a href="login.html" target="_blank">Log In</a>
        <div id="error-message" style="color: red; margin-top: 10px"></div>

      async function handleIndex(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const email = document.getElementById("useremail").value;
        const password = document.getElementById("userpassword").value;

        try {
          const response = await fetch("user_details.json");
          if (!response.ok) {
            throw new Error("Failed to load credentials");
          }

          const data = await response.json();

          const validUser = data.username;
          const validEmail = data.email;
          const validPassword = data.password;

          if (
            username === validUser &&
            email === validEmail &&
            password === validPassword
          ) {
            window.location.href = "index.html";
          } else {
            document.getElementById("error-message").innerText =
              "Invalid username or password!";
          }
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("error-message").innerText =
            "Something went wrong. Please try again.";
        }
      }
