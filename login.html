            <img src="facebook.png" alt="Facebook">
        </a>
        <a href="https://www.linkedin.com/in/mayank-joshi-110623364/" target="_blank">
            <img src="linkdin.webp" alt="LinkedIn">
        </a>
        <a href="https://www.instagram.com/" target="_blank">
            <img src="insta3.avif" alt="Instagram">
        </a>
        <a href="https://github.com/nMayank1621">
            <img src="github.png" alt="Github">
        </a>
        </div>
        </div>
    </form>
  </div>
