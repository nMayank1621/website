<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div class="contact-container">
    <h1>CONTACT US</h1>
    <form class="contact-form" onsubmit="return validateContactForm(event)">
        <input type="text" id="username" placeholder="Your Name" required>
        <input type="email" id="useremail" placeholder="Your Email" required>
        <input type="tel" id="usernumber" placeholder="Phone Number" required>
        <input type="text" id="usersubject" placeholder="Subject" required>
        <textarea id="usermssg" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
        <div id="error-message" style="color:red; margin-top:10px;"></div>
    </form>
  </div>

  <script>
    function validateContactForm(event) {
      event.preventDefault(); 

      const username = document.getElementById('username').value;
      const email = document.getElementById('useremail').value;
      const number = document.getElementById('usernumber').value;
      const subject = document.getElementById('usersubject').value;
      const message = document.getElementById('usermssg').value;

      const validUser = "Mayank";
      const validEmail = "mayankjoshi6545@gmail.com";
      const validNumber = "9717880082";
      const validSubject = "Hello sir";
      const validMessage = "heyy";

      if (
        username === validUser &&
        email === validEmail &&
        number === validNumber &&
        subject === validSubject &&
        message === validMessage
      ) {
        window.location.href = "index.html";
      } else {
        document.getElementById("error-message").innerText =
          "Invalid contact details. Please check your input.";
      }
    }
  </script>
</body>
</html>
